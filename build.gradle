plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'stalker'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "stalker-gametest"
		// Server-side gameplay: server game tests cover it.
		enableGameTests = true
		enableClientGameTests = false
	}
}

// Game tests need a real server (and a local-disk run dir, see below), so they never run inside `build`;
// run them explicitly with `./gradlew runGameTest -Pstalker.runDir=<dir on a local disk>`.
def runGameTests = providers.gradleProperty('stalker.gameTests').isPresent()
tasks.matching { it.name in ['runGameTest', 'checkGametest'] }.configureEach {
	onlyIf { runGameTests }
}

// Minecraft locks its saves, which a VirtioFS shared folder (a VM building in a folder shared from the host) can't:
// `-Pstalker.runDir=<dir on a local disk>` moves the game directories of the runs there.
def runDirOverride = providers.gradleProperty('stalker.runDir')

loom {
	runs {
		configureEach {
			if (runDirOverride.isPresent()) runDir = "${runDirOverride.get()}/${name}"
		}
	}
}

test {
	useJUnitPlatform()
}
